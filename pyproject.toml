[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-scout-mcp"
version = "0.1.0"
description = "MCP server that lets Claude, Cursor and other agents search arXiv, read papers section by section, follow citations and keep a BibTeX library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Hasnat" }]
keywords = ["mcp", "mcp-server", "arxiv", "research", "claude", "cursor", "llm", "agents", "semantic-scholar"]
dependencies = ["mcp>=2.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
paper-scout-mcp = "paper_scout.server:main"

[project.urls]
Homepage = "https://github.com/hasnat23/paper-scout-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_scout"]

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
